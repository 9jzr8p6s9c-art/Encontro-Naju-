
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma carta para você</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Georgia,serif;
  background:#fffaf7;
  overflow-x:hidden;
}

/* ABERTURA */

#intro{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  background:#fffaf7;
}

.prompt{
  color:#9e6670;
  font-size:22px;
  letter-spacing:5px;
}

.envelope{
  width:min(76vw,390px);
  border:0;
  background:transparent;
  cursor:pointer;
}

.envelope img{width:100%;display:block}

.hint{
  color:#a78d8c;
  font:13px Arial;
}

/* ANIMAÇÃO */

#bloom{
  position:fixed;
  inset:0;
  display:none;
  overflow:hidden;
  background:#f8e8e9;
  z-index:10;
}

#bloom.active{display:block}

.bloom-flower{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--w);
  height:auto;
  max-width:none;
  opacity:0;
  mix-blend-mode:multiply;
  transform:translate(-50%,-50%) scale(.03);
  animation:bloom 5s ease-out forwards;
  animation-delay:var(--delay);
}

@keyframes bloom{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.03);
  }
  15%{opacity:1}
  70%{
    transform:translate(-50%,-50%) scale(1.2) rotate(15deg);
    opacity:1;
  }
  100%{
    transform:translate(-50%,-50%) scale(1.75) rotate(25deg);
    opacity:1;
  }
}

/* TELA FINAL */

#final{
  display:none;
  position:relative;
  isolation:isolate;
  min-height:100vh;
  overflow:hidden;
  align-items:center;
  justify-content:center;
  padding:55px 18px;
  background:radial-gradient(
    ellipse at center,
    #fff0f1,
    #f7dfe5 55%,
    #edcbd5
  );
}

#final.show{
  display:flex;
  animation:appear 1s ease;
}

@keyframes appear{
  from{opacity:0}
  to{opacity:1}
}

/* FLORES DO FUNDO */

.bg-flower{
  position:absolute;
  z-index:-1;
  height:auto;
  pointer-events:none;
  mix-blend-mode:multiply;
  object-fit:contain;
}

.flower1{
  width:350px;
  left:-80px;
  top:-20px;
  transform:rotate(-22deg);
  opacity:.48;
}

.flower2{
  width:360px;
  right:-90px;
  top:8%;
  transform:rotate(22deg);
  opacity:.43;
}

.flower3{
  width:370px;
  left:-80px;
  bottom:-35px;
  transform:rotate(13deg);
  opacity:.43;
}

.flower4{
  width:360px;
  right:-85px;
  bottom:-30px;
  transform:rotate(-18deg);
  opacity:.48;
}

.flower5{
  width:210px;
  right:20%;
  top:-70px;
  opacity:.30;
}

.flower6{
  width:200px;
  left:25%;
  bottom:-70px;
  opacity:.28;
}

/* CARTA */

.letter{
  position:relative;
  width:min(100%,650px);
  padding:55px 45px;
  background:linear-gradient(135deg,#fffdf8,#fff8f1);
  border:1px solid #eadbd0;
  box-shadow:0 24px 70px #875d6a25;
  transform:rotate(-.35deg);
}

.letter:before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid #e9d9ce;
  pointer-events:none;
}

.seal{
  width:43px;
  height:43px;
  margin:0 auto 25px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#ad5263;
  color:#f8d9d8;
  font-size:22px;
}

.letter p{
  color:#6e5552;
  font-size:clamp(17px,3.9vw,21px);
  line-height:1.85;
  margin-bottom:19px;
}

.letter p:last-child{margin-bottom:0}

@media(max-width:480px){
  .letter{padding:40px 27px}
  .flower1,.flower3{left:-110px}
  .flower2,.flower4{right:-115px}
}

</style>
</head>

<body>

<main id="intro">
  <div class="prompt">Abra</div>

  <button class="envelope" id="openLetter">
    <img src="envelope.jpg.JPG" alt="Envelope">
  </button>

  <div class="hint">toque na carta para abrir</div>
</main>

<div id="bloom"></div>

<section id="final">

  <img class="bg-flower flower1" src="flor1.jpg" alt="">
  <img class="bg-flower flower2" src="flor2.jpg" alt="">
  <img class="bg-flower flower3" src="flor3.jpg" alt="">
  <img class="bg-flower flower4" src="flor4.jpg" alt="">
  <img class="bg-flower flower5" src="flor5.jpg" alt="">
  <img class="bg-flower flower6" src="flor2.jpg" alt="">

  <article class="letter">

    <div class="seal">✿</div>

    <p>
      Espero que tenha gostado do nosso encontro.
    </p>

    <p>
      Queria fazer desse dia algo um pouquinho diferente,
      algo que pudesse ficar guardado de alguma forma,
      mesmo depois que ele terminasse.
    </p>

    <p>
      E pensei que algumas flores seriam uma maneira bonita de fazer isso.
    </p>

  </article>

</section>

<script>

const flowers=[
  "flor1.jpg.JPG",
  "flor2.jpg.JPG",
  "flor3.jpg.JPG",
  "flor4.jpg.JPG",
  "flor5.jpg.JPG"
];

const intro=document.getElementById("intro");
const bloom=document.getElementById("bloom");
const finalPage=document.getElementById("final");

let opened=false;

document.getElementById("openLetter").addEventListener("click",()=>{

  if(opened)return;
  opened=true;

  intro.style.display="none";
  bloom.classList.add("active");

  const totalFlowers=72;

  for(let i=0;i<totalFlowers;i++){

    const flower=document.createElement("img");

    flower.className="bloom-flower";
    flower.src=flowers[i%flowers.length];
    flower.alt="";

    flower.style.setProperty(
      "--x",
      (Math.random()*112-6)+"%"
    );

    flower.style.setProperty(
      "--y",
      (Math.random()*112-6)+"%"
    );

    flower.style.setProperty(
      "--w",
      (160+Math.random()*240)+"px"
    );

    flower.style.setProperty(
      "--delay",
      (Math.random()*.9)+"s"
    );

    bloom.appendChild(flower);
  }

  setTimeout(()=>{

    bloom.classList.remove("active");
    bloom.replaceChildren();

    finalPage.classList.add("show");

  },5400);

});

</script>

</body>
</html>
